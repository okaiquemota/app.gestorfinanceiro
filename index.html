<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f3f6" />
    <meta name="description" content="O Poupin junta sua renda, suas contas e as faturas dos cartões numa tela só e mostra quanto vai sobrar no fim do mês. Teste grátis, sem cartão." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Poupin · Um mês na vida do seu dinheiro" />
    <meta property="og:description" content="Renda, contas e cartões numa tela só. Saiba hoje quanto vai sobrar no fim do mês." />
    <meta property="og:image" content="/tela.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/icone.png" />
    <link rel="apple-touch-icon" href="/icone.png" />
    <title>Poupin</title>
    <meta name="apple-mobile-web-app-title" content="Poupin" />
    <meta name="application-name" content="Poupin" />
    <script>
      // aplica o tema antes de pintar, pra não piscar claro/escuro
      try {
        var t = localStorage.getItem('gf-theme')
        if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
